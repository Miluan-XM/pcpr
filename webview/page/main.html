<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    %CSP%
    <title>PCPR AI Chat</title>
    <link rel="stylesheet" href="%STYLE_URI%">
</head>

<body>
    <div class="header">
        <div class="header-title">PCPR Webview</div>
        <div class="session-bar">
            <select id="session-selector"></select>
            <button id="new-session-btn" title="新建会话">＋</button>
            <button id="delete-session-btn" title="删除会话">−</button>
            <button id="rename-session-btn" title="重命名会话">✎</button>
        </div>
    </div>
    


    <div class="chat-container" id="chat-container">
        <!-- Messages will be dynamically inserted here -->
    </div>
    <div class="input-area">
        <div id="loading-spinner" style="display:none; justify-content:center; align-items:center; margin: 8px 0;">
            <div class="spinner"></div>
        </div>
        <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" />
        <button id="send-btn">Send</button>
        <div class="plan-toggle" style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="local-plan-toggle" />
            <label for="local-plan-toggle">Use model running locally</label>
        </div>
    </div>
    <script src="%MARKED_URI%"></script>
    <script src="%SCRIPT_URI%"></script>
</body>

</html>
